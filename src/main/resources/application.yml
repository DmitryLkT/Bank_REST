server:
  port: 8060

logging:
  level:
    org.springframework.security: DEBUG
    org.lukdt.bank_card_management: DEBUG

spring:
  application:
    name: bank_card_management

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop